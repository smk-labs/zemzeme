<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دیکته گوگل</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: Vazirmatn, -apple-system, "Segoe UI", Tahoma, sans-serif;
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #fff; color: #1a1a1a;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #e5e5e5; font-size: 13px;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #999; flex: none; }
  body.on #dot { background: #e03131; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #lang {
    margin-inline-start: auto; font: inherit; cursor: pointer;
    background: #f1f1f1; color: inherit; border: 1px solid #ddd;
    border-radius: 6px; padding: 4px 12px;
  }
  main { flex: 1; overflow: auto; padding: 18px; font-size: 22px; line-height: 1.9; white-space: pre-wrap; cursor: text; }
  #final { outline: none; caret-color: #e03131; }
  #interim { opacity: .45; }
  footer {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 14px; border-top: 1px solid #e5e5e5; font-size: 13px;
  }
  .act {
    font: inherit; cursor: pointer; color: inherit;
    background: #f1f1f1; border: 1px solid #ddd; border-radius: 6px;
    padding: 5px 12px; display: inline-flex; align-items: center; gap: 7px;
  }
  .act:hover { background: #e9e9e9; }
  .act kbd {
    font-family: inherit; font-size: 11px; color: #888;
    border: 1px solid #ccc; border-radius: 4px; padding: 0 5px; background: transparent;
  }
  #copied { color: #2b8a3e; visibility: hidden; margin-inline-start: auto; }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ececec; }
    header, footer { border-color: #2a2a2a; }
    #lang, .act { background: #222; border-color: #333; }
    .act:hover { background: #2b2b2b; }
    .act kbd { border-color: #444; color: #999; }
  }
</style>
<header>
  <span id="dot"></span>
  <span id="state">آماده</span>
  <button id="lang"></button>
</header>
<main id="out"><span id="final" contenteditable="plaintext-only"></span><span id="interim"></span></main>
<footer>
  <button class="act" id="btnToggle">توقف <kbd>Space</kbd></button>
  <button class="act" id="btnCommit">تثبیت خاکستری‌ها <kbd>Enter</kbd></button>
  <button class="act" id="btnCopy">کپی همه</button>
  <button class="act" id="btnClear">پاک کردن <kbd>C</kbd></button>
  <button class="act" id="btnFinish">کپی و بستن <kbd>Esc</kbd></button>
  <span id="copied">کپی شد</span>
</footer>
<script>
  const $ = id => document.getElementById(id);
  // دیباگ: رویدادها بدون متن گفتار توی سرور لاگ می‌شن (dictate/log.txt)
  function dbg(m) {
    try {
      console.log('[stt]', m);
      fetch('/log', { method: 'POST', body: m }).catch(() => {});
    } catch (e) {}
  }
  dbg('load ' + navigator.userAgent);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) $('state').textContent = 'این مرورگر تشخیص گفتار نداره، توی کروم بازش کن';

  const sid = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  let lang = localStorage.lang || 'fa-IR';
  let listening = false;
  let finalText = '';
  let lastInterim = '';
  let lastEventAt = Date.now();
  let endsSinceResult = 0;
  let restartTimer = null;
  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;

  function setLang(l) {
    lang = l; localStorage.lang = l; rec.lang = l;
    $('lang').textContent = l === 'fa-IR' ? 'فارسی' : 'English';
    document.documentElement.dir = l === 'fa-IR' ? 'rtl' : 'ltr';
  }

  function setState(t) { $('state').textContent = t; }

  function render() {
    $('final').textContent = finalText;
    $('interim').textContent = lastInterim;
    $('out').scrollTop = $('out').scrollHeight;
  }

  // هر تیکه قطعی‌شده روی دیسک هم ذخیره می‌شه که هیچ‌وقت هیچی از دست نره
  function autosave(chunk) {
    try { fetch('/save', { method: 'POST', body: sid + '\t' + chunk }).catch(() => {}); } catch (e) {}
  }

  // متن ویرایش‌شده توسط کاربر منبع حقیقته
  function syncFromDom() { finalText = $('final').textContent; }

  function appendFinal(chunk) {
    syncFromDom();
    if (finalText && !/\s$/.test(finalText)) finalText += ' ';
    finalText += chunk + ' ';
    autosave(chunk);
    live('final', { text: chunk });
  }

  // باگ‌فیکس اصلی: وقتی سشن تشخیص بسته می‌شه (خطای گذرا، مکث، ری‌استارت)،
  // متن خاکستری معلق رو به جای دور ریختن، قطعی کن
  function salvage() {
    const t = lastInterim.trim();
    if (!t) return;
    dbg('salvaged ' + t.split(/\s+/).length + ' words');
    lastInterim = '';
    appendFinal(t);
    render();
  }

  // تثبیت دستی وسط حرف زدن: خاکستری‌ها قطعی می‌شن، شنیدن ادامه پیدا می‌کنه
  function commit() {
    if (!lastInterim.trim()) return;
    salvage();
    if (listening) try { rec.abort(); } catch (e) {}
  }

  function start() {
    dbg('user: start');
    listening = true;
    endsSinceResult = 0;
    lastEventAt = Date.now();
    clearTimeout(restartTimer);
    try { rec.start(); } catch (e) {}
    document.body.classList.add('on');
    setState('دارم گوش می‌دم');
    live('state', { state: 'listening' });
    $('btnToggle').innerHTML = 'توقف <kbd>Space</kbd>';
  }

  function stop() {
    dbg('user: stop');
    listening = false;
    clearTimeout(restartTimer);
    rec.stop();
    document.body.classList.remove('on');
    setState('متوقف؛ ویرایش آزاده');
    live('state', { state: 'stopped' });
    $('btnToggle').innerHTML = 'ادامه <kbd>Space</kbd>';
  }

  async function copyAll(flash) {
    syncFromDom();
    const t = (finalText + ' ' + lastInterim).replace(/\s+/g, ' ').trim();
    if (!t) return;
    try {
      await navigator.clipboard.writeText(t);
      if (flash) {
        $('copied').style.visibility = 'visible';
        setTimeout(() => $('copied').style.visibility = 'hidden', 1500);
      }
    } catch (e) {}
  }

  function clearAll() {
    finalText = ''; lastInterim = '';
    render();
  }

  function finish() {
    copyAll(true);
    stop();
    setTimeout(() => {
      window.close();
      setTimeout(() => { if (!window.closed) setState('کپی شد؛ برای بستن Cmd+W'); }, 250);
    }, 100);
  }

  ['start', 'audiostart', 'speechstart'].forEach(n => rec['on' + n] = () => { lastEventAt = Date.now(); dbg(n); });

  rec.onresult = e => {
    lastEventAt = Date.now();
    endsSinceResult = 0;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) appendFinal(r[0].transcript.trim());
      else interim += r[0].transcript;
    }
    lastInterim = interim;
    live('interim', { text: lastInterim });
    render();
  };

  // ری‌استارت با تاخیر فزاینده: جلوی طوفان ری‌استارت (ده‌ها بار در ثانیه) رو می‌گیره
  // و اگه start خطا بده، به جای مرگ ساکت، دوباره تلاش می‌کنه
  function scheduleRestart(reason) {
    if (!listening) return;
    if (endsSinceResult >= 8) {
      listening = false;
      document.body.classList.remove('on');
      setState('شبکه ناپایداره؛ Space برای تلاش دوباره');
      $('btnToggle').innerHTML = 'ادامه <kbd>Space</kbd>';
      dbg('gave up after ' + endsSinceResult + ' ends without result');
      live('state', { state: 'gaveup' });
      return;
    }
    if (endsSinceResult >= 3) { setState('اتصال ناپایدار، دوباره وصل می‌شم...'); live('state', { state: 'reconnecting' }); }
    clearTimeout(restartTimer);
    const delay = Math.min(300 * Math.pow(2, Math.max(0, endsSinceResult - 1)), 5000);
    restartTimer = setTimeout(() => {
      if (!listening) return;
      try { rec.start(); }
      catch (err) { dbg('start threw: ' + err.name); endsSinceResult++; scheduleRestart('retry-after-throw'); }
    }, delay);
  }

  // سشن بسته شد: اول نجات خاکستری‌ها، بعد اگه کاربر هنوز می‌خواد، دوباره وصل شو
  rec.onend = () => {
    dbg('end');
    lastEventAt = Date.now();
    endsSinceResult++;
    salvage();
    scheduleRestart('end');
  };

  rec.onerror = e => {
    dbg('error: ' + e.error + (e.message ? ' / ' + e.message : ''));
    lastEventAt = Date.now();
    if (e.error === 'not-allowed') { listening = false; document.body.classList.remove('on'); setState('اجازه میکروفن رد شد'); }
  };

  // پل به پنل نیتیو: نتیجه‌ها از /live می‌رن بیرون، فرمان‌ها از /events میان تو
  const RELAY = new URLSearchParams(location.search).has('relay');

  function live(kind, extra) {
    if (!RELAY) return;
    try { fetch('/live', { method: 'POST', body: JSON.stringify(Object.assign({ kind, sid }, extra || {})) }).catch(() => {}); } catch (e) {}
  }

  if (RELAY) {
    const es = new EventSource('/events');
    es.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.kind !== 'cmd') return;
      if (m.cmd === 'stop') stop();
      else if (m.cmd === 'start') start();
      else if (m.cmd === 'lang') { setLang(m.lang); if (listening) rec.abort(); }
    };
    setInterval(() => live('hb', { listening }), 5000);
  }

  // واچ‌داگ: اگه در حالت شنیدن هیچ رویدادی نیومد، سشن رو بکش تا onend راهش بندازه
  setInterval(() => {
    if (!listening) return;
    if (Date.now() - lastEventAt > 12000) {
      dbg('watchdog: silent 12s, abort');
      lastEventAt = Date.now();
      try { rec.abort(); } catch (e) {}
    }
  }, 4000);

  $('final').addEventListener('input', syncFromDom);
  $('out').addEventListener('click', e => { if (e.target === $('out')) $('final').focus(); });

  document.addEventListener('keydown', e => {
    if (e.code === 'Escape') { e.preventDefault(); finish(); return; }
    const editing = e.target && e.target.isContentEditable;
    if (editing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); listening ? stop() : start(); }
    else if (e.code === 'Enter') { e.preventDefault(); commit(); }
    else if (e.code === 'KeyL') { setLang(lang === 'fa-IR' ? 'en-US' : 'fa-IR'); if (listening) rec.abort(); }
    else if (e.code === 'KeyC') { clearAll(); }
  });

  $('btnToggle').onclick = () => listening ? stop() : start();
  $('btnCommit').onclick = commit;
  $('btnCopy').onclick = () => copyAll(true);
  $('btnClear').onclick = clearAll;
  $('btnFinish').onclick = finish;
  $('lang').onclick = () => { setLang(lang === 'fa-IR' ? 'en-US' : 'fa-IR'); if (listening) rec.abort(); };

  setLang(lang);
  start();
</script>
</html>
